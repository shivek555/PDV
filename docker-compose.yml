version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: privacy-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

  app:
    build: .
    container_name: privacy-vault
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 3000
      # Redis ko container name se hit karenge
      REDIS_URL: redis://redis:6379
      # Mongo Atlas waali URI same rahegi
      MONGODB_URI: ${MONGODB_URI}
    depends_on:
      - redis
    ports:
      - "3000:3000"
